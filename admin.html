<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E4002B;--red-dark:#B30021;--green:#00A14B;--green-dark:#00713A;
  --blue:#0066B3;--blue-dark:#004B86;--gold:#FFC72C;--gold-dark:#E0A800;
  --purple:#7B2FBF;--orange:#FF7A00;
  --ink:#0E1B2C;--paper:#FDFBF6;--paper2:#FFFFFF;--paper3:#F2F0E9;
  --line:#E2DED3;--line2:#D0CBBC;--txt:#16202E;--txt2:#5A6573;--txt3:#8A93A0;
  --shadow:0 2px 8px rgba(14,27,44,0.06);--shadow-lg:0 8px 28px rgba(14,27,44,0.12);
  --r:14px;--r-sm:9px;--r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:60px;}
h1,h2,h3{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.02em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select{font-family:inherit;}

.topbar{background:var(--ink);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:50;}
.topbar-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:11px;}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--gold) 50%,var(--green));display:flex;align-items:center;justify-content:center;font-size:19px;}
.brand h1{font-size:16px;color:#fff;letter-spacing:0;}
.brand p{font-size:10.5px;color:rgba(255,255,255,0.6);letter-spacing:1.5px;text-transform:uppercase;}
.topbar-actions{display:flex;gap:9px;align-items:center;}
.btn{padding:9px 16px;border-radius:30px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;transition:all 0.15s;}
.btn svg{width:15px;height:15px;}
.btn-export{background:var(--gold);color:var(--ink);}
.btn-export:hover{background:var(--gold-dark);}
.btn-load{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.btn-load:hover{background:rgba(255,255,255,0.2);}

.main{max-width:980px;margin:0 auto;padding:20px 18px;}
.status{padding:11px 14px;border-radius:var(--r);margin-bottom:16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.status.ok{background:#E2F6EA;border:1px solid var(--green);color:var(--green-dark);}
.status.warn{background:#FFF6DC;border:1px solid var(--gold);color:var(--gold-dark);}
.status.err{background:#FDECEC;border:1px solid var(--red);color:var(--red);}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.fbtn{padding:7px 14px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);border-radius:30px;color:var(--txt2);background:var(--paper2);transition:all 0.14s;}
.fbtn:hover{border-color:var(--txt2);}
.fbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.day-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt3);margin:18px 0 9px;display:flex;align-items:center;gap:8px;}
.day-label::after{content:'';flex:1;height:1px;background:var(--line);}

.m-card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:9px;cursor:pointer;transition:all 0.15s;}
.m-card:hover{border-color:var(--blue);box-shadow:var(--shadow);}
.m-card.done{border-left:4px solid var(--green);}
.m-card.pending{border-left:4px solid var(--line2);}
.m-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.m-meta{font-size:11px;color:var(--txt3);display:flex;align-items:center;gap:7px;}
.gbadge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff;letter-spacing:0.5px;}
.m-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
.m-team{display:flex;align-items:center;gap:9px;}
.m-team.away{flex-direction:row-reverse;}
.flagimg{border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,0.08);vertical-align:middle;}
.m-name{font-weight:700;font-size:14px;}
.m-score{font-family:'Archivo Black';font-size:22px;min-width:54px;text-align:center;}
.m-score.vs{font-size:13px;color:var(--txt3);font-family:'Archivo';}
.status-tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;}
.st-done{background:#E2F6EA;color:var(--green-dark);}
.st-pending{background:var(--paper3);color:var(--txt3);}

/* OVERLAY FORM */
.overlay{position:fixed;inset:0;background:rgba(14,27,44,0.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--paper);border-radius:var(--r-lg);max-width:640px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden;}
.modal-head{background:var(--ink);color:#fff;padding:18px 22px;position:relative;}
.modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,0.28);}
.modal-meta{font-size:11px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.modal-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
.mvs{text-align:center;}
.mvs .nm{font-weight:700;font-size:14px;color:#fff;margin-top:5px;}
.mvs-mid{font-family:'Archivo Black';font-size:16px;color:var(--gold);}
.modal-body{padding:20px 22px;}
.sec{margin-bottom:20px;}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--txt3);margin-bottom:11px;}

.score-entry{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:16px;}
.score-side{text-align:center;}
.score-side .nm{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:8px;}
.score-in{width:64px;height:58px;border:2px solid var(--line2);border-radius:11px;font-family:'Archivo Black';font-size:28px;text-align:center;color:var(--txt);background:var(--paper);}
.score-in:focus{outline:none;border-color:var(--blue);}
.score-dash{font-family:'Archivo Black';font-size:24px;color:var(--txt3);}

.scorer-row{display:grid;grid-template-columns:1.6fr 60px 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.scorer-row select,.scorer-row input{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:13px;background:var(--paper2);width:100%;}
.scorer-row select:focus,.scorer-row input:focus{outline:none;border-color:var(--blue);}
.scorer-del{width:32px;height:32px;border-radius:8px;background:#FDECEC;color:var(--red);font-size:16px;display:flex;align-items:center;justify-content:center;}
.scorer-del:hover{background:#f9d5d5;}
.add-scorer{width:100%;padding:9px;font-size:12.5px;font-weight:600;color:var(--blue);background:#E8F2FB;border:1px dashed var(--blue);border-radius:8px;margin-top:4px;}
.add-scorer:hover{background:#d5e7f7;}

.ko-extra{background:var(--paper3);border-radius:var(--r);padding:14px;margin-top:12px;}
.ko-extra-title{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.toggle-line{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.toggle-line label{font-size:13px;color:var(--txt2);}
.pen-row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;}

.save-btn{width:100%;padding:13px;background:var(--green);color:#fff;font-weight:700;font-size:14px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
.save-btn:hover{background:var(--green-dark);}
.clear-btn{width:100%;padding:10px;background:none;color:var(--red);font-weight:600;font-size:13px;border-radius:11px;margin-top:8px;border:1px solid var(--line2);}
.clear-btn:hover{background:#FDECEC;border-color:var(--red);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:11px 22px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:all 0.3s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.help-box{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;}
.help-box h2{font-size:19px;margin-bottom:12px;}
.help-box p{font-size:14px;color:var(--txt2);line-height:1.7;margin-bottom:14px;}
.help-box code{background:var(--paper3);padding:2px 7px;border-radius:5px;font-size:13px;}
.help-box .term{background:var(--ink);color:#9fe6b8;padding:12px 16px;border-radius:10px;font-family:monospace;font-size:13px;margin:10px 0;}
@media(max-width:560px){.scorer-row{grid-template-columns:1fr;gap:6px;}.topbar h1{font-size:14px;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="brand-mark">⚙️</div><div><h1>WORLD CUP 2026 — ADMIN</h1><p>Result entry</p></div></div>
    <div class="topbar-actions">
      <button class="btn btn-load" onclick="document.getElementById('fileInput').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Load JSON</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
      <button class="btn btn-export" onclick="exportJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg>Export JSON</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="status warn" id="status">Loading data…</div>
  <div class="filters" id="filters"></div>
  <div id="matchList"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const DATA_FILE='wc2026-data.json';
let DATA=null;
let editing=null;     // current match id being edited
let workScorers=[];   // scratch scorers list for the form

async function loadData(fromFile){
  const status=document.getElementById('status');
  try{
    let json;
    if(fromFile){ json=fromFile; }
    else{
      const res=await fetch(DATA_FILE+'?t='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      json=await res.json();
    }
    DATA=json;
    const played=Object.values(DATA.matches).filter(m=>m.result).length;
    status.className='status ok';
    status.innerHTML=`Data loaded · ${played} of ${Object.keys(DATA.matches).length} results entered · last updated ${DATA.meta.updated} <span style="font-weight:400;color:var(--txt2)">— remember to Export when done</span>`;
    renderFilters(); renderList();
  }catch(e){
    status.className='status err';
    status.textContent='Could not load wc2026-data.json automatically — click "Load JSON" to pick the file manually. ('+e.message+')';
    document.getElementById('matchList').innerHTML=helpBox();
  }
}

function helpBox(){
  return `<div class="help-box"><h2>Load the data file</h2><p>This admin reads <code>wc2026-data.json</code>. If auto-load failed (common with <code>file://</code>), click <strong>Load JSON</strong> above and pick the file.</p><p>To avoid the manual step, run a tiny server in the folder:</p><div class="term">python -m http.server 8000</div><p>Then open <code>localhost:8000/admin.html</code> — auto-load works, and so does the tracker.</p></div>`;
}

document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadData(JSON.parse(r.target.result)); toast('File loaded'); }catch(err){ toast('Invalid JSON'); } };
  r.readAsText(f);
});

function flag(code,size){
  const t=DATA.teams[code]; if(!t)return '';
  const h=size||18,w=Math.round(h*4/3);
  return `<img class="flagimg" src="https://flagcdn.com/${Math.round(w*2)}x${Math.round(h*2)}/${t.iso}.png" width="${w}" height="${h}" alt="${t.name}" loading="lazy">`;
}
function groupColor(g){const map={A:'#E4002B',B:'#0066B3',C:'#00A14B',D:'#FF7A00',E:'#7B2FBF',F:'#00B5C9',G:'#FF5CA8',H:'#E0A800',I:'#B30021',J:'#004B86',K:'#00713A',L:'#9333EA'};return map[g]||'#5A6573';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

let filter='pending';
function renderFilters(){
  const wrap=document.getElementById('filters');
  const opts=[['pending','To enter'],['done','Entered'],['all','All'],['group','Group stage'],['ko','Knockout']];
  wrap.innerHTML=opts.map(([k,l])=>`<button class="fbtn ${filter===k?'active':''}" data-f="${k}">${l}</button>`).join('');
  wrap.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();renderList();});
}

function matchPasses(m){
  if(filter==='pending')return !m.result;
  if(filter==='done')return !!m.result;
  if(filter==='group')return m.stage==='group';
  if(filter==='ko')return m.stage!=='group';
  return true;
}
function resolveTeamName(slotOrCode){
  if(DATA.teams[slotOrCode]) return DATA.teams[slotOrCode].name;
  return slotLabel(slotOrCode);
}
function slotLabel(slot){
  const pos=slot[0];
  if(pos==='1')return 'Winner Group '+slot[1];
  if(pos==='2')return 'Runner-up Group '+slot[1];
  if(pos==='3')return '3rd place';
  if(pos==='W')return 'Winner M'+slot.slice(1);
  if(pos==='L')return 'Loser M'+slot.slice(1);
  return slot;
}

function renderList(){
  const list=document.getElementById('matchList');
  const entries=Object.entries(DATA.matches).filter(([id,m])=>matchPasses(m));
  if(!entries.length){ list.innerHTML='<div style="text-align:center;padding:40px;color:var(--txt3)">No matches in this filter.</div>'; return; }
  const byDate={};
  entries.forEach(([id,m])=>{ const d=m.date||DATA.koDates[m.stage].label; (byDate[d]=byDate[d]||[]).push([id,m]); });
  list.innerHTML=Object.entries(byDate).map(([date,arr])=>{
    const labelExtra=arr[0][1].stage==='group'?` · Round ${arr[0][1].matchday}`:'';
    return `<div class="day-label">${date}${labelExtra}</div>${arr.map(([id,m])=>card(id,m)).join('')}`;
  }).join('');
}

function card(id,m){
  const isGroup=m.stage==='group';
  const hName=isGroup?DATA.teams[m.home].name:resolveTeamName(m.home);
  const aName=isGroup?DATA.teams[m.away].name:resolveTeamName(m.away);
  const hFlag=DATA.teams[m.home]?flag(m.home,22):'';
  const aFlag=DATA.teams[m.away]?flag(m.away,22):'';
  const done=!!m.result;
  const tag=isGroup?`<span class="gbadge" style="background:${groupColor(m.group)}">GR ${m.group}</span>`:`<span class="gbadge" style="background:var(--purple)">${DATA.koDates[m.stage].label}</span>`;
  const scoreHtml=done?`<div class="m-score">${m.result.home}–${m.result.away}</div>`:`<div class="m-score vs">VS</div>`;
  return `<div class="m-card ${done?'done':'pending'}" onclick="openForm('${id}')"><div class="m-top"><div class="m-meta">${tag}<span>${m.date||''} ${m.cet?'· '+m.cet+' CEST':''}</span></div><span class="status-tag ${done?'st-done':'st-pending'}">${done?'Entered':'To enter'}</span></div><div class="m-teams"><div class="m-team">${hFlag}<span class="m-name">${hName}</span></div>${scoreHtml}<div class="m-team away">${aFlag}<span class="m-name">${aName}</span></div></div></div>`;
}

function openForm(id){
  const m=DATA.matches[id]; const isGroup=m.stage==='group';
  const hResolved=DATA.teams[m.home], aResolved=DATA.teams[m.away];
  if(!hResolved||!aResolved){ toast('Teams not decided yet — enter earlier rounds first'); return; }
  editing=id;
  workScorers = m.result&&m.result.scorers ? JSON.parse(JSON.stringify(m.result.scorers)) : [];
  const r=m.result||{home:'',away:''};
  const hName=hResolved.name, aName=aResolved.name;

  const koExtra = !isGroup ? `
    <div class="ko-extra">
      <div class="ko-extra-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Knockout extras (if needed)</div>
      <div class="toggle-line">
        <input type="checkbox" id="hasET" ${m.result&&m.result.et?'checked':''} onchange="document.getElementById('etFields').style.display=this.checked?'block':'none'">
        <label for="hasET">Went to extra time</label>
      </div>
      <div id="etFields" style="display:${m.result&&m.result.et?'block':'none'};margin-bottom:10px">
        <div style="font-size:11px;color:var(--txt3);margin-bottom:6px">Score after extra time (full score incl. ET goals goes in the main boxes above)</div>
      </div>
      <div class="toggle-line">
        <input type="checkbox" id="hasPens" ${m.result&&m.result.penalties?'checked':''} onchange="document.getElementById('penFields').style.display=this.checked?'block':'none'">
        <label for="hasPens">Decided on penalties</label>
      </div>
      <div id="penFields" style="display:${m.result&&m.result.penalties?'block':'none'}">
        <div style="font-size:11px;color:var(--txt3);margin-bottom:8px">Penalty shootout score</div>
        <div class="pen-row">
          <input type="number" min="0" max="20" class="score-in" id="penH" style="width:54px;height:46px;font-size:22px" value="${m.result&&m.result.penalties?m.result.penalties.home:''}" placeholder="–">
          <span class="score-dash">:</span>
          <input type="number" min="0" max="20" class="score-in" id="penA" style="width:54px;height:46px;font-size:22px" value="${m.result&&m.result.penalties?m.result.penalties.away:''}" placeholder="–">
        </div>
      </div>
    </div>` : '';

  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><button class="modal-close" onclick="closeForm()">×</button>
      <div class="modal-meta">${isGroup?`Group ${m.group} · Round ${m.matchday}`:DATA.koDates[m.stage].label} · ${m.date} · ${m.cet||''} ${m.cet?'CEST':''}</div>
      <div class="modal-vs"><div class="mvs">${flag(m.home,40)}<div class="nm">${hName}</div></div><div class="mvs-mid">VS</div><div class="mvs">${flag(m.away,40)}<div class="nm">${aName}</div></div></div>
    </div>
    <div class="modal-body">
      <div class="sec">
        <div class="sec-title">Final score</div>
        <div class="score-entry">
          <div class="score-side"><div class="nm">${flag(m.home,16)} ${hName}</div><input type="number" min="0" max="30" class="score-in" id="scoreH" value="${r.home}" placeholder="–" oninput="syncScorerCount()"></div>
          <span class="score-dash">:</span>
          <div class="score-side"><div class="nm">${flag(m.away,16)} ${aName}</div><input type="number" min="0" max="30" class="score-in" id="scoreA" value="${r.away}" placeholder="–" oninput="syncScorerCount()"></div>
        </div>
        ${koExtra}
      </div>
      <div class="sec">
        <div class="sec-title">Goalscorers</div>
        <div id="scorerList"></div>
        <button class="add-scorer" onclick="addScorer()">+ Add goalscorer</button>
      </div>
      <button class="save-btn" onclick="saveResult('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/></svg>Save result</button>
      ${m.result?`<button class="clear-btn" onclick="clearResult('${id}')">Clear this result</button>`:''}
    </div>`;
  renderScorers();
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function renderScorers(){
  const m=DATA.matches[editing];
  const teams=[m.home,m.away];
  const list=document.getElementById('scorerList');
  if(!workScorers.length){ list.innerHTML='<div style="font-size:12px;color:var(--txt3);padding:6px 0">No goalscorers added. Click below to add (optional — score saves without them too).</div>'; return; }
  list.innerHTML=workScorers.map((s,i)=>{
    const teamPlayers=DATA.teams[s.team]?DATA.teams[s.team].players:[];
    return `<div class="scorer-row">
      <select onchange="updScorer(${i},'team',this.value);renderScorers()">
        ${teams.map(t=>`<option value="${t}" ${s.team===t?'selected':''}>${DATA.teams[t].name}</option>`).join('')}
      </select>
      <input type="number" min="1" max="120" value="${s.minute||''}" placeholder="min" onchange="updScorer(${i},'minute',this.value)">
      <select onchange="updScorer(${i},'playerId',this.value)">
        <option value="">— player —</option>
        ${teamPlayers.map(p=>`<option value="${p.id}" ${s.playerId===p.id?'selected':''}>${p.name} (${p.pos})</option>`).join('')}
      </select>
      <select onchange="updScorer(${i},'type',this.value)" style="grid-column:auto">
        <option value="goal" ${s.type==='goal'?'selected':''}>Goal</option>
        <option value="penalty" ${s.type==='penalty'?'selected':''}>Pen</option>
        <option value="own_goal" ${s.type==='own_goal'?'selected':''}>OG</option>
      </select>
      <button class="scorer-del" onclick="delScorer(${i})">×</button>
    </div>`;
  }).join('');
}
function addScorer(){
  const m=DATA.matches[editing];
  workScorers.push({team:m.home,playerId:'',minute:'',type:'goal'});
  renderScorers();
}
function updScorer(i,field,val){ workScorers[i][field]=field==='minute'?(val?parseInt(val):''):val; }
function delScorer(i){ workScorers.splice(i,1); renderScorers(); }
function syncScorerCount(){ /* informational only; scorers are optional */ }

function saveResult(id){
  const h=document.getElementById('scoreH').value, a=document.getElementById('scoreA').value;
  if(h===''||a===''){ toast('Enter both scores'); return; }
  const result={ home:parseInt(h), away:parseInt(a) };
  // clean scorers: only those with a player selected
  const cleanScorers=workScorers.filter(s=>s.playerId&&s.minute!=='').map(s=>({playerId:s.playerId,team:s.team,minute:parseInt(s.minute),type:s.type||'goal'}));
  if(cleanScorers.length) result.scorers=cleanScorers;
  // knockout extras
  const m=DATA.matches[id];
  if(m.stage!=='group'){
    const hasPens=document.getElementById('hasPens');
    if(hasPens&&hasPens.checked){
      const ph=document.getElementById('penH').value, pa=document.getElementById('penA').value;
      if(ph!==''&&pa!=='') result.penalties={home:parseInt(ph),away:parseInt(pa)};
    }
    const hasET=document.getElementById('hasET');
    if(hasET&&hasET.checked) result.et=true;
  }
  DATA.matches[id].result=result;
  DATA.meta.updated=new Date().toISOString().slice(0,16).replace('T',' ');
  DATA.meta.updatedBy='admin';
  closeForm(); renderList(); updateStatus();
  toast('Result saved — Export JSON when done');
}
function clearResult(id){
  if(!confirm('Clear this result?'))return;
  DATA.matches[id].result=null;
  DATA.meta.updated=new Date().toISOString().slice(0,16).replace('T',' ');
  closeForm(); renderList(); updateStatus();
  toast('Result cleared');
}
function updateStatus(){
  const played=Object.values(DATA.matches).filter(m=>m.result).length;
  const status=document.getElementById('status');
  status.className='status ok';
  status.innerHTML=`Data loaded · ${played} of ${Object.keys(DATA.matches).length} results entered · last updated ${DATA.meta.updated} <span style="font-weight:400;color:var(--txt2)">— remember to Export when done</span>`;
}
function closeForm(){ editing=null; document.getElementById('overlay').classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')closeForm(); });

function exportJSON(){
  if(!DATA){ toast('No data loaded'); return; }
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='wc2026-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Downloaded — replace the file in your folder');
}

loadData();
</script>
</body>
</html>
